name: collect

# Intraday snapshots every 15 minutes, 13:00-20:45 UTC, which covers the US session in
# both EDT and EST. GitHub delays or drops scheduled runs under load (on the first day,
# 4 of 5 fixed slots never started), so slots are dense and the collector itself decides:
# a stale-chain guard skips pre-open, post-close and holiday runs, and the scorer later
# picks one snapshot per event (the one closest to 120 min before settlement).
on:
  schedule:
    - cron: "*/15 13-20 * * 1-5"
    - cron: "30 13 * * 1-6"     # next-morning settlement join + report
  workflow_dispatch:
    inputs:
      task:
        description: "snapshot | settle-report | smoke"
        default: "smoke"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e . --no-deps
      - run: echo "JOB_START=$(date -u +%Y-%m-%dT%H:%M:%S)" >> "$GITHUB_ENV"

      - name: snapshot
        if: (github.event_name == 'schedule' && github.event.schedule != '30 13 * * 1-6') || inputs.task == 'snapshot'
        run: python -m kme snapshot || true      # failures are recorded in data/run_log.csv

      - name: settle and report
        if: github.event.schedule == '30 13 * * 1-6' || inputs.task == 'settle-report'
        run: |
          python -m kme settle || true
          python -m kme report

      - name: smoke
        if: inputs.task == 'smoke'
        run: python -m kme smoke

      - name: commit derived data
        if: inputs.task != 'smoke'
        run: |
          git config user.name "kme-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data results
          git diff --cached --quiet && exit 0
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep $((i*5)); done
          exit 1

      - name: fail loudly if a stage failed in this run (GitHub then e-mails you)
        if: inputs.task != 'smoke'
        run: |
          python - <<'EOF'
          import os, sys
          import pandas as pd
          p = "data/run_log.csv"
          if not os.path.exists(p):
              sys.exit(0)
          log = pd.read_csv(p)
          start = pd.Timestamp(os.environ["JOB_START"], tz="UTC")
          now = log[pd.to_datetime(log["run_time"], utc=True) >= start]
          bad = now[now["status"] == "failed"]
          print(now.to_string(index=False))
          sys.exit(1 if len(bad) else 0)
          EOF
